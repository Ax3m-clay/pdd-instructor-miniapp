name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Проверка синтаксиса Python
        run: python3 -m py_compile helper/autoschool_helper.py helper/webapp/webapp.py

      - name: Сборка Docker-образа
        run: docker build -t autoschool-helper ./helper

      - name: Проверка, что в образе не root
        run: test "$(docker run --rm autoschool-helper whoami)" = "app"
